[build-system]
requires = ["setuptools>=61", "setuptools-scm"]
build-backend = "setuptools.build_meta"

[project]
name = "ailab"
dynamic = ["version"]
description = "LXD-based sandboxes for running AI tools safely on Ubuntu"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "GPL-3.0-or-later" }
keywords = ["lxd", "ai", "sandbox", "ollama", "lemonade", "openclaw"]
dependencies = [
    "pylxd>=2.4.0",
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.29.0",
    "aiohttp>=3.9.0",
]

[project.scripts]
ailab = "ailab.cli:main"

[tool.setuptools_scm]
# fallback for builds without git history (e.g. Launchpad binary builds);
# the release workflow sets SETUPTOOLS_SCM_PRETEND_VERSION explicitly.
fallback_version = "0.0.0"

[tool.setuptools.packages.find]
where = ["."]
include = ["ailab*"]

[tool.setuptools.package-data]
"ailab.scripts" = ["*.sh", "*.js", "*.py", "*.bash"]
"ailab.web" = ["static/**/*", "static/*"]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
# Pin the rule set CI enforces: ruff 0.16 broadened its default selection,
# which would start failing on long-standing patterns. Widen deliberately,
# not via upstream default changes.
select = ["E4", "E7", "E9", "F"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[project.optional-dependencies]
test = ["pytest>=7"]
