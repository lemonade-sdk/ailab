name: CI

on:
  pull_request:
  push:
    branches: [main]


jobs:
  # ── Python lint ─────────────────────────────────────────────────────────────
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - run: pip install --quiet ruff
      - run: ruff check ailab/

  # ── Smoke test — import and CLI ─────────────────────────────────────────────
  test:
    name: Smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install package
        run: pip install --quiet -e .

      - name: Check imports
        run: |
          python -c "
          import ailab
          from ailab import cli, container
          from ailab.installers import INSTALLERS
          print('imports OK')
          print('installers:', list(INSTALLERS))
          "

      - name: Check CLI help
        run: |
          ailab --help
          ailab new --help
          ailab install --help

  # ── Unit tests ──────────────────────────────────────────────────────────────
  unit:
    name: Unit tests (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install package with test extras
        run: pip install --quiet -e '.[test]'

      - name: Run pytest
        run: pytest -q

  # ── Build the strict snap and smoke-test it ─────────────────────────────────
  snap:
    name: Build snap
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          # setuptools-scm / the snapcraft override-pull run `git describe
          # --tags`, so the full history and tags must be present.
          fetch-depth: 0

      - name: Build snap
        uses: snapcore/action-build@v1
        id: build

      - name: Install and smoke-test
        run: |
          sudo snap install --dangerous "${{ steps.build.outputs.snap }}"
          ailab --version
          ailab --help
          # Exercises the app catalog client and the network plug; falls back
          # to the built-in list (still exit 0) if the catalog is unreachable.
          ailab packages

      - name: Upload snap artifact
        uses: actions/upload-artifact@v4
        with:
          name: ailab-snap
          path: ${{ steps.build.outputs.snap }}

  # ── Build source package and run lintian ────────────────────────────────────
  lintian:
    name: Lintian
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install build tools
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q \
            devscripts \
            debhelper \
            dh-python \
            lintian \
            pybuild-plugin-pyproject \
            python3-all \
            python3-setuptools \
            python3-setuptools-scm

      - name: Build source package (unsigned)
        # -d skips build-dep checks; not needed for source-only (-S) builds
        run: debuild -us -uc -S -d

      - name: Run lintian
        run: lintian --fail-on error ../*.changes
